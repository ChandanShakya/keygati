<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -->
    <title>KeyGati Words Test — Free Online Typing Test</title>

    <meta
        name="description"
        content="Take a free Words typing test with KeyGati. Practice typing a fixed set of words and measure your WPM, accuracy, and typing performance."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="canonical"
        href="https://keygati.com/words.html"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >

    <!-- Browser Theme Color -->
    <meta
        name="theme-color"
        content="#A8DADC"
    >

    <!-- Open Graph -->
    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://keygati.com/words.html"
    >

    <meta
        property="og:title"
        content="KeyGati Words Test — Free Online Typing Test"
    >

    <meta
        property="og:description"
        content="Practice typing a fixed set of words and measure your WPM, accuracy, and typing performance with KeyGati."
    >

    <meta
        property="og:site_name"
        content="KeyGati"
    >

    <!-- Twitter / X -->
    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="KeyGati Words Test — Free Online Typing Test"
    >

    <meta
        name="twitter:description"
        content="Practice typing words and measure your typing speed and accuracy with KeyGati."
    >

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "KeyGati Words Test",
        "url": "https://keygati.com/words.html",
        "description": "A free words typing test for measuring typing speed, accuracy, and typing performance."
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        keygati: {
                            background: "#A8DADC",
                            dark: "#264653",
                            teal: "#2A9D8F",
                            yellow: "#E9C46A",
                            orange: "#F4A261",
                            coral: "#E76F51",
                            light: "#F1FAEE"
                        }
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="style.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9910178999537907"
         crossorigin="anonymous"></script>
</head>

<body class="min-h-screen bg-keygati-background text-keygati-dark">

    <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-5 sm:px-8">

        <!-- HEADER -->
        <header
            class="flex flex-wrap items-center justify-between gap-4 border-b border-keygati-dark/10 py-4">

            <a href="index.html" class="shrink-0 text-xl font-bold tracking-tight">
                <span class="text-keygati-teal">Key</span><span class="text-keygati-dark">Gati</span>
            </a>

            <nav
                aria-label="Typing test modes"
                class="flex max-w-full items-center overflow-x-auto rounded-full bg-white/40 p-1 shadow-sm ring-1 ring-black/5 backdrop-blur-sm">

                <a
                    href="timemode.html"
                    class="shrink-0 rounded-full px-5 py-2 text-sm font-medium text-keygati-dark/55 transition-colors hover:bg-white/50 hover:text-keygati-dark">
                    Time
                </a>

                <a
                    href="words.html"
                    class="shrink-0 rounded-full bg-white px-5 py-2 text-sm font-semibold text-keygati-dark shadow-sm ring-1 ring-black/5">
                    Words
                </a>

            </nav>
        </header>


        <!-- MAIN -->
        <main class="mx-auto w-full max-w-5xl px-0 pb-16 pt-20">

            <!-- STATS -->
            <section class="mt-10 flex justify-center">

                <div class="grid w-full max-w-2xl grid-cols-3 gap-4">

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            WPM
                        </p>

                        <p
                            id="wpm-value"
                            class="mt-1 text-2xl font-semibold tracking-tight">
                            0
                        </p>
                    </div>

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            Accuracy
                        </p>

                        <p
                            id="accuracy-value"
                            class="mt-2 text-2xl font-semibold tracking-tight text-keygati-teal">
                            100%
                        </p>
                    </div>

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            Score
                        </p>

                        <p
                            id="score-value"
                            class="mt-1 text-2xl font-semibold tracking-tight">
                            0
                        </p>
                    </div>

                </div>

            </section>


            <!-- TYPING AREA -->
    
            <section class="mt-12">

                <div
                    class="rounded-2xl bg-white/50 px-5 py-8 ring-1 ring-black/5 sm:px-8 sm:py-10">

                    <div class="flex items-center justify-between gap-4">

                        <p class="text-sm font-medium text-keygati-dark/60">
                            Practice
                        </p>

                        <p
                            id="progress-value"
                            class="text-sm font-medium text-keygati-dark/50">
                            0 / 14
                        </p>

                    </div>


                    <div
                        class="mt-8 min-h-[150px] w-full overflow-hidden">

                        <p
                            id="typing-text"
                            class="typing-text w-full max-w-full break-words whitespace-normal text-lg leading-[2.2] sm:text-xl sm:leading-[2.2]">
                        </p>

                    </div>

                </div>

            </section>

            <!-- RESTART -->
            <div class="mt-8 flex justify-center">

                <button
                    id="restart-button"
                    type="button"
                    class="rounded-full bg-keygati-dark px-6 py-2.5 text-xs font-medium text-white shadow-sm transition-all hover:bg-keygati-teal hover:shadow-md">

                    ↻ Restart

                </button>

            </div>

            <div class="help-guides">
                <a href="help.html" class="help-guides-button">
                    Help &amp; Guides →
                </a>
            </div>

        </main>

    </div>


    <script src="words.js"></script>

</body>

</html>
