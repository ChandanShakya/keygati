<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KeyGati - Words</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        keygati: {
                            background: "#A8DADC",
                            dark: "#264653",
                            teal: "#2A9D8F",
                            yellow: "#E9C46A",
                            orange: "#F4A261",
                            coral: "#E76F51",
                            light: "#F1FAEE"
                        }
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-keygati-background text-keygati-dark">

    <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-5 sm:px-8">

        <!-- HEADER -->
        <header
            class="flex flex-wrap items-center justify-between gap-4 border-b border-keygati-dark/10 py-4">

            <a href="index.html" class="shrink-0 text-xl font-bold tracking-tight">
                <span class="text-keygati-teal">Key</span><span class="text-keygati-dark">Gati</span>
            </a>

            <nav
                aria-label="Typing test modes"
                class="flex max-w-full items-center overflow-x-auto rounded-full bg-white/40 p-1 shadow-sm ring-1 ring-black/5 backdrop-blur-sm">

                <a
                    href="index.html"
                    class="shrink-0 rounded-full px-5 py-2 text-sm font-medium text-keygati-dark/55 transition-colors hover:bg-white/50 hover:text-keygati-dark">
                    Time
                </a>

                <a
                    href="words.html"
                    class="shrink-0 rounded-full bg-white px-5 py-2 text-sm font-semibold text-keygati-dark shadow-sm ring-1 ring-black/5">
                    Words
                </a>

                <a
                    href="quote.html"
                    class="shrink-0 rounded-full px-5 py-2 text-sm font-medium text-keygati-dark/55 transition-colors hover:bg-white/50 hover:text-keygati-dark">
                    Quote
                </a>

                <a
                    href="zen.html"
                    class="shrink-0 rounded-full px-5 py-2 text-sm font-medium text-keygati-dark/55 transition-colors hover:bg-white/50 hover:text-keygati-dark">
                    Zen
                </a>

                <a
                    href="numbers.html"
                    class="shrink-0 rounded-full px-5 py-2 text-sm font-medium text-keygati-dark/55 transition-colors hover:bg-white/50 hover:text-keygati-dark">
                    Numbers
                </a>

            </nav>
        </header>


        <!-- MAIN -->
        <main class="mx-auto w-full max-w-5xl px-0 pb-16 pt-20">

            <!-- STATS -->
            <!-- STATS -->
            <section class="mt-0 flex justify-center">

                <div class="grid w-full max-w-2xl grid-cols-3 gap-4">

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            WPM
                        </p>

                        <p
                            id="wpm-value"
                            class="mt-1 text-2xl font-semibold tracking-tight">
                            0
                        </p>
                    </div>

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            Accuracy
                        </p>

                        <p
                            id="accuracy-value"
                            class="mt-1 text-2xl font-semibold tracking-tight">
                            100%
                        </p>
                    </div>

                    <div class="rounded-xl bg-white/50 p-4 ring-1 ring-black/5">
                        <p class="text-xs font-medium uppercase tracking-wider text-keygati-dark/50">
                            Score
                        </p>

                        <p
                            id="score-value"
                            class="mt-1 text-2xl font-semibold tracking-tight">
                            0
                        </p>
                    </div>

                </div>

            </section>


            <!-- TYPING AREA -->
    
            <section class="mt-12">

                <div
                    class="rounded-2xl bg-white/30 px-5 py-8 ring-1 ring-black/5 sm:px-8 sm:py-10">

                    <div class="flex items-center justify-between gap-4">

                        <p class="text-sm font-medium text-keygati-dark/60">
                            Practice
                        </p>

                        <p
                            id="progress-value"
                            class="text-sm font-medium text-keygati-dark/50">
                            0 / 14
                        </p>

                    </div>


                    <div
                        class="mt-8 min-h-[150px] w-full overflow-hidden">

                        <p
                            id="typing-text"
                            class="typing-text w-full max-w-full break-words whitespace-normal text-lg leading-[2.2] sm:text-xl sm:leading-[2.2]">
                        </p>

                    </div>

                </div>

            </section>

            <!-- RESTART -->
            <div class="mt-8 flex justify-center">

                <button
                    id="restart-button"
                    type="button"
                    class="rounded-full bg-keygati-dark px-6 py-2.5 text-xs font-medium text-white shadow-sm transition-all hover:bg-keygati-teal hover:shadow-md">

                    ↻ Restart

                </button>

            </div>

        </main>

    </div>


    <script src="words.js"></script>

</body>

</html>
